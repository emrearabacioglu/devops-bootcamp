---
- name: Configure instance for ansible
  hosts: tag_Role_ansible_server
  tasks:
    - name: install pip
      become: true
      ansible.builtin.dnf:
        update_cache: true
        name:
          - python3.12
          - python3.12-pip

    - name: install ansible and libs
      ansible.builtin.pip:
        executable: pip3.12
        name: 
          - ansible
          - boto3
          - botocore
        extra_args: --user

    - name: copy private key
      ansible.builtin.copy:
        src: '/root/.ssh/id_rsa'
        dest: '/home/ec2-user/.ssh/id_rsa'
        mode: "0600"
    
    - name: copy playbooks and jar file
      ansible.builtin.copy:
        src: 'control-node/'
        dest: '/home/ec2-user/control-node/'

    - name: install mysql roles
      environment:
        PATH: "/home/ec2-user/.local/bin:{{ ansible_env.PATH }}"
      community.general.ansible_galaxy_install: 
        type: role
        name: geerlingguy.mysql
