---
- name: Launch EC2 Instance
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Get my public IP
      ansible.builtin.uri:
        url: https://checkip.amazonaws.com
        return_content: true
      register: ip_result

    - name: Set my_ip
      ansible.builtin.set_fact:
        my_ip: "{{ ip_result.content | trim }}"

    - name: Set up key pair
      amazon.aws.ec2_key:
        name: ansible-key
        region: "{{ aws_region }}"
        key_material: "{{ lookup('file', '/root/.ssh/id_rsa.pub') }}"
        force: false
        tags:
          Environment: ansible-lab

    - name: configure sg
      amazon.aws.ec2_security_group:
        name: ansible-sg
        description: sg for ansible lab
        region: "{{ aws_region }}"
        rules:
          - proto: tcp
            from_port: 22
            to_port: 22
            cidr_ip: "{{ my_ip }}/32"
        tags:
          Environment: ansible-lab

    - name: create IAM role
      amazon.aws.iam_role: 
        name: ansible-role
        assume_role_policy_document: {"Version": "2012-10-17", "Statement": [{"Effect": "Allow", "Principal": {"Service": "ec2.amazonaws.com"}, "Action": "sts:AssumeRole"}]}
        description: IAM role for ansible server
        managed_policies:
          - arn:aws:iam::aws:policy/AmazonEC2FullAccess
          - arn:aws:iam::aws:policy/AmazonSSMReadOnlyAccess
        tags:
          Environment: ansible-lab

    - name: Launch EC2 Instance
      amazon.aws.ec2_instance:
        name: ansible-server
        key_name: ansible-key
        instance_type: t3.small
        security_group: ansible sg
        iam_instance_profile: ansible-role
        region: "{{ aws_region }}"
        image_id: "{{ lookup('amazon.aws.ssm_parameter', '/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64', region=aws_region) }}"
        filters: 
          "tag:Name": ansible-server
          instance-state-name: ["running", "pending"]
        exact_count: 1
        tags:
          Environment: ansible-lab
          Role: ansible-server
          OS: amazon
          