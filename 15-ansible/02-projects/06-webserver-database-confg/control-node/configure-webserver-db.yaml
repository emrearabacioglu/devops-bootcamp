---
- name: Configure mysql database
  hosts: tag_Role_db_server
  become: true
  roles:
    - role: geerlingguy.mysql
      mysql_databases:
        - name: my_db
      mysql_users:
        - name: emre
          host: "%"
          password: mysql123
          priv: "my_db.*:ALL"


- name: Create linux user and check/install java
  hosts: tag_Role_web_server
  become: True
  tasks:
  - name: create user
    ansible.builtin.user:
      name: "{{ app_user }}"
      group: adm

  - name: update apt repo cache
    ansible.builtin.apt: update_cache=yes force_apt_get=yes cache_valid_time=3600
  - name: Install Java
    ansible.builtin.apt: name=openjdk-17-jre-headless
  - name: Install acl (needed for become_user)
    ansible.builtin.apt: name=acl

- name: Clear old file and stop running java app
  hosts: tag_Role_web_server
  become: True
  become_user: "{{ app_user }}"
  tasks:
  - name: Find jar file
    ansible.builtin.find:
      paths: /home/{{ app_user }}
      patterns: "*.jar"
      file_type: file
    register: jar_files
  - ansible.builtin.debug: msg={{ jar_files }}

  - name: get java app's process id
    ignore_errors: yes
    ansible.builtin.shell: "ps -few | grep java | awk '{print $2}'"
    register: running_java_processes
    when: jar_files.files != []
  - ansible.builtin.debug: msg={{ running_java_processes }}

  - name: Kill Java processes
    ignore_errors: True
    ansible.builtin.shell: " kill {{ running_java_processes.stdout_lines[0] }}"
    when: running_java_processes is not skipped and running_java_processes.stdout_lines | length > 2

  - name: remove old jar
    ansible.builtin.shell: "rm {{ jar_files.files[0].path }}"
    when: jar_files.files != []

- name: Deploy java application
  hosts: tag_Role_web_server
  become: True
  become_user: "{{ app_user }}"
  tasks:
  - name: Copy jar file to remote server
    ansible.builtin.copy:
      src: "{{ jar_name }}"
      dest: /home/{{ app_user }}
  - name: Start the application
    environment:
      DB_NAME: my_db
      DB_USER: emre
      DB_PWD: mysql123
      DB_SERVER: "{{ hostvars[groups['tag_Role_db_server'][0]].private_ip_address }}"
    ansible.builtin.shell: 
      chdir: /home/{{ app_user }}
      cmd: nohup java -jar {{ jar_name }} > app.log 2>&1 &
  - name: wait for app to listen 8080
    ansible.builtin.wait_for:
      port: 8080
      timeout: 60
  - name: Check that application started and is running
    ansible.builtin.shell: ps aux | grep java
    register: app_status
  - ansible.builtin.debug: msg="{{ app_status.stdout_lines }}"  