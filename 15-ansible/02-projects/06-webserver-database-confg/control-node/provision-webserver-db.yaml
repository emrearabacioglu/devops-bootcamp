---
- name: Provision webserver and database server
  hosts: localhost
  gather_facts: false
  tasks: 
    - name: get default vpc id
      amazon.aws.ec2_vpc_net_info:
        region: "{{ aws_region }}"
        filters:
          "is-default": "true"
      register: vpc_info

    - ansible.builtin.debug: msg="{{vpc_info.vpcs[0].id}}"
    - ansible.builtin.debug: msg="{{ vpc_info.vpcs[0].cidr_block }}"

    - name: get subnet info
      amazon.aws.ec2_vpc_subnet_info:
        region: "{{ aws_region }}"
        filters: 
          vpc-id: "{{vpc_info.vpcs[0].id}}"
          "default-for-az": "true"
      register: subnet_info

    - ansible.builtin.debug: msg="{{ subnet_info.subnets | map(attribute='cidr_block') | list }}"
    - ansible.builtin.debug: msg="{{ subnet_info.subnets[0].id }}"

    - name: Save network info
      ansible.builtin.set_fact:
        vpc_id: "{{vpc_info.vpcs[0].id}}"
        vpc_cidr: "{{ vpc_info.vpcs[0].cidr_block }}"
        public_subnet_id: "{{ subnet_info.subnets[0].id }}"
        public_subnet_az: "{{ subnet_info.subnets[0].availability_zone }}"


    - name: Create private subnet
      amazon.aws.ec2_vpc_subnet:
        state: present
        vpc_id: "{{ vpc_id }}"
        cidr: 172.31.48.0/20
        az: "{{ public_subnet_az }}"
        region: "{{ aws_region }}"
        tags: 
          Name: database-subnet
          Environment: ansible-lab
      register: prv_subnet_info

    - name: Create NAT gateway
      amazon.aws.ec2_vpc_nat_gateway:
        state: present
        subnet_id: "{{ public_subnet_id }}"
        region: "{{ aws_region }}"
        if_exist_do_not_create: true
        wait: true
        tags: 
          Environment: ansible-lab
      register: nat_info
    - ansible.builtin.debug: msg="{{prv_subnet_info.subnet.id}}"
    - ansible.builtin.debug: msg="{{nat_info.nat_gateway_id}}"

    - name: Save private subnet and NAT info
      ansible.builtin.set_fact:
        private_subnet_id: "{{prv_subnet_info.subnet.id}}"
        nat_gateway_id: "{{nat_info.nat_gateway_id}}"

    - name: Create route table
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc_id }}"
        region: "{{ aws_region }}"
        subnets:
          - "{{ private_subnet_id }}"
        routes:
          - dest: 0.0.0.0/0
            gateway_id: "{{ nat_gateway_id }}"
        tags:
          Environment: ansible-lab

    - name: configure sg for webserver
      amazon.aws.ec2_security_group:
        name: web-sg
        description: sg for webserver
        region: "{{ aws_region }}"
        vpc_id: "{{ vpc_id }}"
        rules:
          - proto: tcp
            from_port: 22
            to_port: 22
            cidr_ip: "{{ vpc_cidr }}"
          - proto: tcp
            from_port: 8080
            to_port: 8080
            cidr_ip: 0.0.0.0/0
        tags:
          Environment: ansible-lab

    - name: configure sg for db
      amazon.aws.ec2_security_group:
        name: db-sg
        description: sg for db
        region: "{{ aws_region }}"
        vpc_id: "{{ vpc_id }}"
        rules:
          - proto: tcp
            from_port: 22
            to_port: 22
            cidr_ip: "{{ vpc_cidr }}"
          - proto: tcp
            from_port: 3306
            to_port: 3306
            group_name: web-sg
        tags:
          Environment: ansible-lab

    - name: Launch webserver EC2 Instance
      amazon.aws.ec2_instance:
        name: web-server
        key_name: ansible-key
        instance_type: t3.small
        security_group: web-sg
        vpc_subnet_id: "{{ public_subnet_id }}"
        region: "{{ aws_region }}"
        image_id: "{{ lookup('amazon.aws.ssm_parameter', '/aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id', region=aws_region) }}"
        filters: 
          "tag:Name": web-server
          instance-state-name: ["running", "pending"]
        exact_count: 1
        tags:
          Environment: ansible-lab
          Role: web-server
          OS: ubuntu

    - name: Launch database EC2 Instance
      amazon.aws.ec2_instance:
        name: db-server
        key_name: ansible-key
        instance_type: t3.small
        security_group: db-sg
        vpc_subnet_id: "{{ private_subnet_id }}"
        region: "{{ aws_region }}"
        image_id: "{{ lookup('amazon.aws.ssm_parameter', '/aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id', region=aws_region) }}"
        filters: 
          "tag:Name": db-server
          instance-state-name: ["running", "pending"]
        exact_count: 1
        tags:
          Environment: ansible-lab
          Role: db-server
          OS: ubuntu

