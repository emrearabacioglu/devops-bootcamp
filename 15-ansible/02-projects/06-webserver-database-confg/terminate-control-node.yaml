---
- name: Terminate Ansible Control Node Resources
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Terminate ec2 instance
      amazon.aws.ec2_instance:
        region: "{{ aws_region }}"
        name: ansible-server
        filters: 
          "tag:Role": ansible-server
          instance-state-name: ["running", "pending", "stopped"]
        state: absent
      
    - name: Terminate sg
      amazon.aws.ec2_security_group:
        region: "{{ aws_region }}"
        name: ansible-sg
        state: absent
      
    - name: Terminate IAM Role
      amazon.aws.iam_role:
        region: "{{ aws_region }}"
        name: ansible-role
        delete_instance_profile: true
        state: absent
      
    - name: Terminate keypair
      amazon.aws.ec2_key:
        region: "{{ aws_region }}"
        name: ansible-key
        state: absent