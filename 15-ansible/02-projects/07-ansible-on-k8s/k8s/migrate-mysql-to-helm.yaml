---
- name: Migrate mysql to helmchart
  hosts: localhost
  gather_facts: false
  tasks:
  - name: Get cluster name from terraform
    ansible.builtin.set_fact:
      cluster_name: "{{ lookup('pipe', 'terraform -chdir=terraform output -raw cluster_name') }}"

  - name: update kubeconfig
    ansible.builtin.command: "aws eks update-kubeconfig --name {{ cluster_name }} --region {{ aws_region }}"

  - name: Update secret
    kubernetes.core.k8s:
      state: present
      src: "{{ playbook_dir }}/k8s/db-secret.yaml"

  - name: deploy mysql chart
    kubernetes.core.helm:
      name: mysql
      chart_ref: mysql
      chart_repo_url: https://charts.bitnami.com/bitnami
      chart_version: 14.0.3
      release_namespace: default
      values_files:
        - "{{ playbook_dir }}/k8s/mysql-values.yaml"
      wait: true
      wait_timeout: 600s

  - name: Update configmap
    kubernetes.core.k8s:
      state: present
      src: "{{ playbook_dir }}/k8s/db-config-chart.yaml"

  - name: Restart java app to pick up new config
    ansible.builtin.command: kubectl rollout restart deployment/java-app-deployment

  - name: Wait until new java pods are ready
    ansible.builtin.command: kubectl rollout status deployment/java-app-deployment --timeout=300s

  - name: destroy old Mysql
    kubernetes.core.k8s:
      state: absent
      src: "{{ playbook_dir }}/k8s/mysql.yaml"
      wait: true
  
  - name: Get loadbalancer address
    kubernetes.core.k8s_info:
      kind: Ingress
      name: java-app-ingress
      namespace: default
    register: ingress_info
    until: ingress_info.resources[0].status.loadBalancer.ingress[0].hostname is defined
    retries: 20
    delay: 15

  - ansible.builtin.debug: 
      msg: "http://{{ingress_info.resources[0].status.loadBalancer.ingress[0].hostname}}"