---
- name: Deploy java/mysql to cluster
  hosts: localhost
  gather_facts: false
  tasks:
  - name: Get cluster name from terraform
    ansible.builtin.set_fact:
      cluster_name: "{{ lookup('pipe', 'terraform -chdir=terraform output -raw cluster_name') }}"

  - name: update kubeconfig
    ansible.builtin.command: "aws eks update-kubeconfig --name {{ cluster_name }} --region {{ aws_region }}"

  - name: deploy nginx
    kubernetes.core.helm:
      name: ingress-nginx
      chart_ref: ingress-nginx
      chart_repo_url: https://kubernetes.github.io/ingress-nginx
      release_namespace: ingress-nginx
      create_namespace: true
      wait: true

  - name: Create secret
    kubernetes.core.k8s:
      state: present
      src: "{{ playbook_dir }}/k8s/db-secret.yaml"
  - name: Create configmap
    kubernetes.core.k8s:
      state: present
      src: "{{ playbook_dir }}/k8s/db-config.yaml"

  - name: Deploy mysql
    kubernetes.core.k8s:
      state: present
      src: "{{ playbook_dir }}/k8s/mysql.yaml"
      wait: true

  - name: Deploy java app
    kubernetes.core.k8s:
      state: present
      src: "{{ playbook_dir }}/k8s/java-app.yaml"
      wait: true

  - name: Deploy ingress
    kubernetes.core.k8s:
      state: present
      src: "{{ playbook_dir }}/k8s/java-app-ingress.yaml"
  
  - name: Get loadbalancer address
    kubernetes.core.k8s_info:
      kind: Ingress
      name: java-app-ingress
      namespace: default
    register: ingress_info
    until: ingress_info.resources[0].status.loadBalancer.ingress[0].hostname is defined
    retries: 20
    delay: 15

  - ansible.builtin.debug: 
      msg: "http://{{ingress_info.resources[0].status.loadBalancer.ingress[0].hostname}}"