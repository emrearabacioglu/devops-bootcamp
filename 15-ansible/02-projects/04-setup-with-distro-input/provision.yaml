---
- name: Launch EC2 Instance
  hosts: localhost
  gather_facts: false
  vars_files: os_config.yaml
  tasks:
    - name: Set up key pair
      amazon.aws.ec2_key:
        name: ansible-key
        region: "{{ aws_region }}"
        key_material: "{{ lookup('file', '/root/.ssh/id_rsa.pub') }}"
        force: false
    - name: configure sg
      amazon.aws.ec2_security_group:
        name: "{{os_config[os].sg_name}}"
        description: sg for ansible lab
        region: "{{ aws_region }}"
        rules:
          - proto: tcp
            from_port: 22
            to_port: 22
            cidr_ip: "{{ my_ip }}/32"
          - proto: tcp
            from_port: 8080
            to_port: 8080
            cidr_ip: 0.0.0.0/0

    - name: Launch EC2 Instance
      amazon.aws.ec2_instance:
        name: "{{os_config[os].server_name}}"
        key_name: ansible-key
        instance_type: t3.small
        security_group: "{{os_config[os].sg_name}}"
        region: "{{ aws_region }}"
        image_id: "{{ lookup('amazon.aws.ssm_parameter', os_config[os].image_parameter, region=aws_region) }}"
        filters: 
          "tag:Name": "{{os_config[os].server_name}}"
          "tag:OS": "{{os_config[os].os_tag}}"
          instance-state-name: ["running", "pending"]
        exact_count: 1
        tags:
          Environment: ansible-lab
          OS: "{{os_config[os].os_tag}}"
          Role: jenkins
          