---
- name: Configure environment for Jenkins
  hosts: tag_Name_jenkins_ubuntu_server
  become: true
  handlers:
    - name: restart jenkins
      ansible.builtin.systemd_service:
        name: jenkins
        enabled: true
        state: restarted

  tasks:

  - name: install jenkins key
    ansible.builtin.get_url:
      url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
      dest: /etc/apt/keyrings/jenkins-keyring.asc
  - name: add jenkins repo
    ansible.builtin.apt_repository:
      repo: deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/
      filename: jenkins

  - name: Install java
    ansible.builtin.apt: 
      update_cache: true
      name:
        - openjdk-21-jre
        - fontconfig

  - name: Install packages
    ansible.builtin.apt: 
      name:
        - jenkins
        - docker.io
        - nodejs
        - npm

  - name: add jenkins user to docker group
    ansible.builtin.user:
      name: jenkins
      groups: docker
      append: true
    notify: restart jenkins

  - name: run docker
    ansible.builtin.systemd_service:
      name: docker
      enabled: true
      state: started
  - name: run jenkins
    ansible.builtin.systemd_service:
      name: jenkins
      enabled: true
      state: started
  - name: wait for pwd
    ansible.builtin.wait_for:
      path: /var/lib/jenkins/secrets/initialAdminPassword
  - name: get pwd 
    ansible.builtin.slurp:
      src: /var/lib/jenkins/secrets/initialAdminPassword
    register: jenkins_pwd
  - ansible.builtin.debug: msg="{{ jenkins_pwd.content | b64decode }}"
