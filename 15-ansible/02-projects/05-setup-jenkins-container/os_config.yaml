os_config: 
  amazon:
    server_name: jenkins-amazon-server
    image_parameter: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    os_tag: amazon
    sg_name: amazon-sg
  ubuntu:
    server_name: jenkins-ubuntu-server
    image_parameter: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    os_tag: ubuntu
    sg_name: ubuntu-sg