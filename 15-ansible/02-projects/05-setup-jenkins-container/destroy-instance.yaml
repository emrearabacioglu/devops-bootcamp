---
- name: Destroy Jenkins server
  hosts: localhost
  gather_facts: false
  vars_files: os_config.yaml
  tasks:
    - name: Terminate Jenkins instance
      amazon.aws.ec2_instance:
        region: "{{ aws_region }}"
        state: absent
        filters:
          "tag:OS": "{{os_config[os].os_tag}}"
          "tag:Name": "{{os_config[os].server_name}}"
          instance-state-name: ["pending", "running", "stopping", "stopped"]

    - name: Delete security group
      amazon.aws.ec2_security_group:
        region: "{{ aws_region }}"
        name: "{{os_config[os].sg_name}}"
        state: absent

    - name: Delete key pair
      amazon.aws.ec2_key:
        region: "{{ aws_region }}"
        name: ansible-key
        state: absent