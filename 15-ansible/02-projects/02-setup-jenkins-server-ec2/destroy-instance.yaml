---
- name: Destroy Jenkins server
  hosts: localhost
  gather_facts: false
  vars:
    aws_region: eu-central-1
  tasks:
    - name: Terminate Jenkins instance
      amazon.aws.ec2_instance:
        region: "{{ aws_region }}"
        state: absent
        filters:
          "tag:Name": "jenkins-ami-server"
          instance-state-name: ["pending", "running", "stopping", "stopped"]

    - name: Delete security group
      amazon.aws.ec2_security_group:
        region: "{{ aws_region }}"
        name: ansible-sg
        state: absent

    - name: Delete key pair
      amazon.aws.ec2_key:
        region: "{{ aws_region }}"
        name: ansible-key
        state: absent