---
- name: Deploy java/mysql to cluster
  hosts: localhost
  gather_facts: false
  tasks:
  - name: Get cluster name from terraform
    ansible.builtin.set_fact:
      cluster_name: "{{ lookup('pipe', 'terraform -chdir=terraform output -raw cluster_name') }}"

  - name: update kubeconfig
    ansible.builtin.command: "aws eks update-kubeconfig --name {{ cluster_name }} --region {{ aws_region }}"

  - name: deploy prometheus chart
    kubernetes.core.helm:
      name: prometheus
      chart_ref: kube-prometheus-stack
      chart_repo_url: https://prometheus-community.github.io/helm-charts
      release_namespace: monitoring
      create_namespace: true
      values_files:
        - "{{ playbook_dir }}/k8s/prometheus-values.yaml"
      wait: true
      wait_timeout: 600s

  - name: deploy nginx
    kubernetes.core.helm:
      name: ingress-nginx
      chart_ref: ingress-nginx
      chart_repo_url: https://kubernetes.github.io/ingress-nginx
      release_namespace: ingress-nginx
      create_namespace: true
      wait: true

  - name: Create secret
    kubernetes.core.k8s:
      namespace: default
      state: present
      src: "{{ playbook_dir }}/k8s/db-secret.yaml"
  - name: Create configmap
    kubernetes.core.k8s:
      namespace: default
      state: present
      src: "{{ playbook_dir }}/k8s/db-config-chart.yaml"

  - name: deploy mysql chart
    kubernetes.core.helm:
      name: mysql
      chart_ref: mysql
      chart_repo_url: https://charts.bitnami.com/bitnami
      chart_version: 14.0.3
      release_namespace: default
      values_files:
        - "{{ playbook_dir }}/k8s/mysql-values.yaml"
      wait: true
      wait_timeout: 600s

  - name: Deploy java app
    kubernetes.core.k8s:
      namespace: default
      state: present
      src: "{{ playbook_dir }}/k8s/java-app.yaml"
      wait: true

  - name: Deploy ingress
    kubernetes.core.k8s:
      namespace: default
      state: present
      src: "{{ playbook_dir }}/k8s/java-app-ingress.yaml"
  
  - name: Get loadbalancer address
    kubernetes.core.k8s_info:
      kind: Ingress
      name: java-app-ingress
      namespace: default
    register: ingress_info
    until: ingress_info.resources[0].status.loadBalancer.ingress[0].hostname is defined
    retries: 20
    delay: 15

  - ansible.builtin.debug: 
      msg: "http://{{ingress_info.resources[0].status.loadBalancer.ingress[0].hostname}}"