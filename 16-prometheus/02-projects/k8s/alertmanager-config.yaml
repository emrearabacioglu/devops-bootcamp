apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager-config
  namespace: monitoring
spec:
  route:
    receiver: 'null'
    repeatInterval: 30m
    routes:
    - matchers:
      - name: team
        value: developers
      receiver: slack
    - matchers:
      - name: team
        value: k8s-admin
      receiver: email
  receivers:
  - name: 'null'
  - name: slack
    slackConfigs:
    - apiURL:
        name: alertmanager-credentials
        key: slack-webhook-url
      sendResolved: true
  - name: email
    emailConfigs:
    - to: 'emrearabacolu@gmail.com'
      from: 'emrearabacolu@gmail.com'
      smarthost: 'smtp.gmail.com:587'
      authUsername: 'emrearabacolu@gmail.com'
      authIdentity: 'emrearabacolu@gmail.com'
      authPassword:
        name: alertmanager-credentials
        key: smtp-password
      sendResolved: true