apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-secret
  namespace: my-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: db-secret
    creationPolicy: Owner
  # Every JSON key of the secret (DB_USER, DB_PWD, DB_NAME) becomes a key of db-secret.
  dataFrom:
    - extract:
        key: staging/myapp/db
