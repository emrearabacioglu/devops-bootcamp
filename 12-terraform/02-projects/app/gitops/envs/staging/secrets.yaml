# ClusterSecretStore + ExternalSecret: copies staging/myapp/db from AWS Secrets Manager
# into the Kubernetes Secret db-secret in my-app.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/emrearabacioglu/devops-bootcamp.git
    targetRevision: main
    path: 12-terraform/02-projects/app/gitops/envs/staging/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: my-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
